resource:
    name: CartItems
    shortName: items

    properties:
        idProductMeasurementSalesUnit:
            type: string
            writable: false
            readable: true
            required: false
            responseOptional: true
            description: 'Selected sales unit identifier. Answered only for an item of a product sold in a measurement unit; an item of a plain product carries none.'

        salesUnit:
            type: object
            objectName: SalesUnit
            writable: true
            readable: true
            required: false
            responseOptional: true
            description: 'Sales-unit selection for products priced by a measurement unit (e.g. kg, m, L). Carries the sales-unit identifier and the chosen amount in that unit; required when adding/updating items of measurable products. Answered only for such an item; an item of a plain product carries none.'
            properties:
                id:
                    type: integer
                    description: 'Sales-unit identifier.'
                    openapiContext:
                        example: 1
                amount:
                    type: string
                    description: 'Chosen amount in the sales unit, as a decimal string to preserve its scale.'
                    openapiContext:
                        example: '1.5'
